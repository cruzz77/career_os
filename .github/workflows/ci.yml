name: ci

on:
  push:
    branches: [development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint, types, tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned by commit SHA: a tag can be moved to different code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies exactly as locked
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check app tests
      - name: Lint
        run: uv run ruff check app tests
      - name: Type-check
        run: uv run mypy
      # Integration tests run in testcontainers on the exact ParadeDB image from
      # infra/docker-compose.yml, including the migration up/down/up round trip.
      - name: Tests
        run: uv run pytest -q --cov --cov-report=term
      - name: Audit runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes --strict

  image:
    name: docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose files are valid
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml config --quiet
      - name: Build the api image (not pushed)
        run: docker build -t careeros-api:ci backend
      - name: Runs as non-root and embeds with no network
        run: |
          test "$(docker run --rm careeros-api:ci id -u)" = "10001"
          docker run --rm --network none careeros-api:ci python -c "import os; from fastembed import TextEmbedding; m = TextEmbedding(model_name=os.environ['EMBEDDING_MODEL'], cache_dir=os.environ['FASTEMBED_CACHE_PATH']); assert len(next(iter(m.embed(['ci'])))) == 384"
