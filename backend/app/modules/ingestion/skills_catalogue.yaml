# Canonical skill catalogue (blueprint 5: skills, skill_aliases). Seeded idempotently by
# `python -m app.cli seed-skills`. Versioned: bump `version` on any change.
#
# Aliases are the ONLY strings matched; a canonical name is not matched implicitly. That is how
# ambiguous names stay safe: Go matches "golang" (not the verb "go"), R matches "r programming",
# Excel is absent because "you will excel" is common in postings. Aliases are stored normalised
# (casefolded, whitespace collapsed) and matched as whole phrases; the longest match wins, so
# "react native" is React Native only, "ruby on rails" is Ruby on Rails only.
version: 2
categories: [language, frontend, backend, database, data, ml, cloud, devops, mobile, security,
             testing, design, product, business, domain]
